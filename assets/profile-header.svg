<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">GermanSed developer profile</title>
  <desc id="description">A dark blue and purple gradient banner for a junior software developer focused on backend, DevOps, and automation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071225"/>
      <stop offset="0.42" stop-color="#123A70"/>
      <stop offset="0.75" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="40" r="300" fill="url(#glow)"/>
  <circle cx="130" cy="330" r="250" fill="url(#glow)" opacity="0.5"/>

  <g opacity="0.72" fill="none" stroke="#A5F3FC" stroke-width="2">
    <path d="M900 86h56l22 28h76"/>
    <path d="M936 138h76l24 28h92"/>
    <path d="M886 214h54l26-28h98"/>
    <circle cx="892" cy="86" r="6" fill="#67E8F9"/>
    <circle cx="928" cy="138" r="6" fill="#C4B5FD"/>
    <circle cx="878" cy="214" r="6" fill="#5EEAD4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="62" width="196" height="38" rx="19" fill="#052E2B" stroke="#5EEAD4" stroke-opacity="0.72"/>
    <circle cx="101" cy="81" r="7" fill="#4ADE80"/>
    <text x="119" y="87" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">OPEN TO WORK</text>
  </g>

  <text x="76" y="190" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="1">GermanSed</text>
  <text x="80" y="238" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Junior Software Developer</text>
  <text x="80" y="287" fill="#A5F3FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="2.2">BACKEND  •  DEVOPS  •  AUTOMATION</text>
</svg>
